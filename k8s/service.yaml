apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: vllm
  labels:
    app: vllm-inference
  annotations:
    # Internal load balancer only - no public access
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: vllm-inference
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000