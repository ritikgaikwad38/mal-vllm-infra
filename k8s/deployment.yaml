apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: vllm
  labels:
    app: vllm-inference
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vllm-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: vllm
          image: YOUR_ECR_URL/mal-vllm:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: MODEL_NAME
              value: "facebook/opt-125m"
            - name: MAX_MODEL_LEN
              value: "512"
            - name: DTYPE
              value: "float32"
            # CPU mode - no GPU required
            # For GPU production change to:
            # value: "float16"

          # CPU mode resource limits
          # For GPU production:
          # limits:
          #   nvidia.com/gpu: "1"
          #   memory: "16Gi"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "2000m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3

          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface

      volumes:
        - name: model-cache
          emptyDir: {}

      # Ensure pods only run in UAE region nodes
      nodeSelector:
        role: vllm-cpu

      # Spread pods across AZs for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: vllm-inference

---
# Service Account with least privilege
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-sa
  namespace: vllm
  annotations:
    # IRSA - pod level AWS permissions only
    eks.amazonaws.com/role-arn: arn:aws:iam::YOUR_ACCOUNT_ID:role/vllm-pod-role